<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Editar Proyecto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h2 {
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-cancel {
            background-color: #888;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Editar Proyecto</h2>

        <form method="POST">
            <div class="form-group">
                <label>Nombre del Proyecto</label>
                <input type="text" name="nombre" value="{{ proyecto.nombre }}" required>
            </div>

            <div class="form-group">
                <label>Ubicación</label>
                <input type="text" name="ubicacion" value="{{ proyecto.ubicacion }}" required>
            </div>

            <div class="form-group">
                <label>Estado</label>
                <select name="id_estado" required>
                    {% for estado in estados %}
                    {% if estado.id_estado == proyecto.id_estado %}
                    <option value="{{ estado.id_estado }}" selected>{{ estado.estado }}</option>
                    {% else %}
                    <option value="{{ estado.id_estado }}">{{ estado.estado }}</option>
                    {% endif %}
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Fecha de Inicio</label>
                <input type="date" name="fecha_inicio" value="{{ proyecto.fecha_inicio }}" required>
            </div>

            <div class="form-group">
                <label>Fecha de Fin</label>
                <input type="date" name="fecha_fin" value="{{ proyecto.fecha_fin }}" required>
            </div>

            <div class="form-group">
                <label>Presupuesto Estimado</label>
                <input type="number" step="0.01" name="costo_estimado" value="{{ proyecto.costo_estimado }}" required>
            </div>

            <button type="submit">Guardar Cambios</button>
            <a href="{{ url_for('proyecto_detalle', id=proyecto.id_proyecto) }}">
                <button type="button" class="btn-cancel">Cancelar</button>
            </a>
        </form>
    </div>
</body>
</html>
